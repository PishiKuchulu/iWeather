name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # AUD-011: actions pinned by commit SHA (tag shown in the comment).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iweather-debug
          path: app/build/outputs/apk/debug/*.apk
      # AUD-011: (re)generate the dependency lockfile baseline; the artifact is
      # committed back as gradle.lockfile, after which locking can go strict.
      - name: Generate dependency lockfile
        run: gradle testDebugUnitTest assembleDebug assembleRelease --write-locks
      - name: Upload dependency lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gradle-lockfile
          path: |
            gradle.lockfile
            app/gradle.lockfile
          if-no-files-found: ignore
