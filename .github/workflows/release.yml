name: Release APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.6.0). Leave empty to use versionName from build.gradle.kts.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # AUD-011: actions pinned by commit SHA (tag shown in the comment).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Decode release keystore
        env:
          IWEATHER_KEYSTORE_BASE64: ${{ secrets.IWEATHER_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$IWEATHER_KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret IWEATHER_KEYSTORE_BASE64 is not set — cannot sign the release."
            exit 1
          fi
          echo "$IWEATHER_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/iweather-release.jks"
          ls -la "$RUNNER_TEMP/iweather-release.jks"
      - name: Build signed release APK
        env:
          IWEATHER_KEYSTORE_PATH: ${{ runner.temp }}/iweather-release.jks
          IWEATHER_KEYSTORE_PASSWORD: ${{ secrets.IWEATHER_KEYSTORE_PASSWORD }}
          IWEATHER_KEY_ALIAS: ${{ secrets.IWEATHER_KEY_ALIAS }}
          IWEATHER_KEY_PASSWORD: ${{ secrets.IWEATHER_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace
      - name: Verify the release artifact (AUD-002)
        env:
          IWEATHER_KEYSTORE_PASSWORD: ${{ secrets.IWEATHER_KEYSTORE_PASSWORD }}
          IWEATHER_KEY_ALIAS: ${{ secrets.IWEATHER_KEY_ALIAS }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee certs.txt
          if "$AAPT2" dump badging "$APK" | grep -q "debuggable"; then
            echo "::error::Release APK is debuggable — refusing to publish."
            exit 1
          fi
          EXPECTED=$("$JAVA_HOME/bin/keytool" -list -v \
            -keystore "$RUNNER_TEMP/iweather-release.jks" \
            -storepass "$IWEATHER_KEYSTORE_PASSWORD" \
            -alias "$IWEATHER_KEY_ALIAS" | grep "SHA256:" | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')
          ACTUAL=$(grep "Signer #1 certificate SHA-256 digest" certs.txt | awk '{print $NF}')
          echo "expected signer: $EXPECTED"
          echo "actual signer:   $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::APK signer does not match the release keystore."
            exit 1
          fi
      - name: Prepare release asset
        run: |
          VERSION="${{ inputs.release_tag }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "iWeather-${VERSION}.apk"
          sha256sum "iWeather-${VERSION}.apk" > "iWeather-${VERSION}.apk.sha256"
          ls -lh iWeather-*
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" \
            "iWeather-${VERSION}.apk" \
            "iWeather-${VERSION}.apk.sha256" \
            --target main \
            --title "iWeather ${VERSION}" \
            --notes "🌤️ **iWeather — اپلیکیشن آب‌وهوای فارسی با صحنه‌های زندهٔ آسمون**

          - 🆕 **آپدیت داخل خود اپ** (مثل Anvex): بررسی خودکار نسخهٔ جدید، دانلود با بررسی SHA-256 و امضا، نصب با یه لمس — از تنظیمات ← درباره هم دستی می‌تونی چک کنی
          - 📍 مدیر چند لوکیشن: افزودن شهر از جستجو بدون سوییچ، مرتب‌سازی شهرهای ذخیره‌شده، نشان شهر فعلی
          - 🌗 تم روز و شب (خودکار بر اساس روز/شب بودن لوکیشن، یا دستی از تنظیمات ← ظاهر) + رابط ظریف‌تر
          - 🔏 این نسخه برای اولین بار با **کی‌استور اختصاصی** امضا شده (نه امضای دیباگ)
          - 🌌 ۱۶ صحنهٔ روز/شب متناسب با هوای واقعی + ذره‌های زنده (باران، برف، تگرگ، ستاره، رعدوبرق)
          - 🧠 حال‌وهوای امروز، «چی بپوشم؟»، هشدارهای هوشمند و امتیاز فعالیت (دویدن، پیاده‌روی، عکاسی، رانندگی)
          - 🇮🇷 فارسی کامل و راست‌به‌چپ، تاریخ شمسی، اعداد فارسی
          - 📊 ساعت‌به‌ساعت ۴۸ ساعت + پیش‌بینی ۱۶ روزه + کیفیت هوا و UV
          - 🔌 داده از Open-Meteo — رایگان، بدون API Key

          ⚠️ **توجه برای نصب روی نسخه‌های قبلی:** چون امضای اپ عوض شده، نصب مستقیم روی ۱.۵.۰ یا قدیمی‌تر ممکن نیست؛ یه بار اپ رو حذف و این نسخه رو تازه نصب کن (شهرهای ذخیره‌شده و تنظیمات با حذف پاک می‌شن). از این نسخه به بعد، آپدیت‌ها از داخل خود اپ نصب می‌شن.

          📦 **iWeather-${VERSION}.apk** — signed with the project's dedicated keystore. The .sha256 sidecar sits next to it for download verification, and the in-app updater requires it.

          Android weather app with live illustrated sky scenes, Persian-first UI, Jalali calendar — free Open-Meteo data, no API key. NOTE: the signing key changed with this release (dedicated keystore instead of the debug key), so upgrading from 1.5.0 or older needs one uninstall + fresh install; from 1.6.0 on, updates install in-app."
