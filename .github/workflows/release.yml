name: Release APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Prepare release asset
        run: |
          VERSION="${{ inputs.release_tag }}"
          VERSION="${VERSION#v}"
          cp app/build/outputs/apk/debug/app-debug.apk "iWeather-${VERSION}.apk"
          sha256sum "iWeather-${VERSION}.apk" > "iWeather-${VERSION}.apk.sha256"
          ls -lh iWeather-*
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ inputs.release_tag }}"
          VERSION="${VERSION#v}"
          gh release create "${{ inputs.release_tag }}" \
            "iWeather-${VERSION}.apk" \
            "iWeather-${VERSION}.apk.sha256" \
            --target main \
            --title "iWeather ${VERSION}" \
            --notes "🌤️ **iWeather — اپلیکیشن آب‌وهوای فارسی با صحنه‌های زندهٔ آسمون**

          - 🌌 ۱۶ صحنهٔ روز/شب متناسب با هوای واقعی + ذره‌های زنده (باران، برف، تگرگ، ستاره، رعدوبرق)
          - 🧠 حال‌وهوای امروز، «چی بپوشم؟»، هشدارهای هوشمند و امتیاز فعالیت (دویدن، پیاده‌روی، عکاسی، رانندگی)
          - 🇮🇷 فارسی کامل و راست‌به‌چپ، تاریخ شمسی، اعداد فارسی
          - 📊 ساعت‌به‌ساعت ۲۴ ساعت + پیش‌بینی ۷ روزه + کیفیت هوا و UV
          - 🔌 داده از Open-Meteo — رایگان، بدون API Key

          📦 **iWeather-${VERSION}.apk** — نسخهٔ قابل نصب (فعلاً با امضای دیباگ منتشر شده؛ ریلیز امضاشده با کی‌استور اختصاصی در ادامه می‌آید). فایل .sha256 برای بررسی صحت دانلود کنارشه.

          Android weather app with live illustrated sky scenes, Persian-first UI, Jalali calendar — free Open-Meteo data, no API key. Debug-signed installable build for now."
